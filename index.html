<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>台股機構投資人買賣分析系統</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            width: 100%;
            position: relative;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background: linear-gradient(135deg, #e8f4f8 0%, #f5f7fa 100%);
            padding: 10px;
            min-height: 100vh;
            width: 100%;
            position: relative;
        }

        @media (min-width: 768px) {
            body {
                padding: 20px;
            }
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            min-width: 0;
        }

        .header {
            background: white;
            padding: 15px 15px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.08);
            margin-bottom: 10px;
            position: relative;
        }

        @media (min-width: 768px) {
            .header {
                padding: 25px 30px;
                border-radius: 20px;
                margin-bottom: 20px;
            }
        }

        .version {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 0.75em;
            color: #95a5a6;
            font-weight: 500;
        }

        @media (min-width: 768px) {
            .version {
                top: 20px;
                right: 25px;
                font-size: 0.85em;
            }
        }

        .market-selector {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 10px;
        }

        @media (min-width: 768px) {
            .market-selector {
                gap: 10px;
                margin-bottom: 12px;
            }
        }

        .market-btn {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            color: #495057;
            border: 2px solid transparent;
            padding: 8px 16px;
            border-radius: 980px;
            font-size: 0.85em;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @media (min-width: 768px) {
            .market-btn {
                padding: 10px 24px;
                font-size: 0.95em;
            }
        }

        .market-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 16px rgba(102, 126, 234, 0.35);
        }

        .market-btn:hover:not(.active) {
            background: linear-gradient(135deg, #e9ecef 0%, #dee2e6 100%);
            transform: translateY(-2px);
            border: 2px solid #667eea;
        }

        h1 {
            color: #2c3e50;
            font-size: 1.4em;
            margin-bottom: 6px;
            text-align: center;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        @media (min-width: 768px) {
            h1 {
                font-size: 2.2em;
                margin-bottom: 8px;
            }
        }

        .subtitle {
            text-align: center;
            color: #7f8c8d;
            font-size: 0.85em;
            margin-bottom: 12px;
            font-weight: 400;
        }

        @media (min-width: 768px) {
            .subtitle {
                font-size: 1em;
                margin-bottom: 16px;
            }
        }

        .category-tabs {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 0;
            flex-wrap: wrap;
        }

        @media (min-width: 768px) {
            .category-tabs {
                gap: 12px;
                margin-bottom: 0;
            }
        }

        .category-tab {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            color: #495057;
            border: none;
            padding: 10px 20px;
            border-radius: 980px;
            font-size: 0.9em;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 2px solid transparent;
        }

        @media (min-width: 768px) {
            .category-tab {
                padding: 12px 32px;
                font-size: 1em;
            }
        }

        .category-tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.35);
        }

        .category-tab:hover:not(.active) {
            background: linear-gradient(135deg, #e9ecef 0%, #dee2e6 100%);
            transform: translateY(-2px);
            border: 2px solid #667eea;
        }

        .controls {
            background: white;
            padding: 15px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.08);
            margin-bottom: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            justify-content: space-between;
        }

        @media (min-width: 768px) {
            .controls {
                padding: 24px;
                border-radius: 20px;
                margin-bottom: 20px;
                gap: 16px;
            }
        }

        .sort-group {
            display: flex;
            gap: 8px;
            align-items: center;
            flex: 1;
            min-width: 200px;
        }

        @media (min-width: 768px) {
            .sort-group {
                gap: 12px;
            }
        }

        .sort-label {
            color: #7f8c8d;
            font-size: 0.85em;
            font-weight: 500;
            white-space: nowrap;
        }

        @media (min-width: 768px) {
            .sort-label {
                font-size: 0.95em;
            }
        }

        .sort-select {
            flex: 1;
            min-width: 0;
            padding: 10px 12px;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            font-size: 0.9em;
            background: white;
            color: #2c3e50;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }

        @media (min-width: 768px) {
            .sort-select {
                padding: 12px 16px;
                border-radius: 14px;
                font-size: 1em;
            }
        }

        .sort-select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .sort-toggle {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 0.9em;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.25);
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        @media (min-width: 768px) {
            .sort-toggle {
                padding: 12px 20px;
                border-radius: 14px;
                font-size: 1em;
                gap: 8px;
            }
        }

        .sort-toggle:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.35);
        }

        .sort-toggle:active {
            transform: translateY(0);
        }

        .table-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.08);
            overflow-x: auto;
            overflow-y: hidden;
            margin-bottom: 30px;
            -webkit-overflow-scrolling: touch;
            max-width: 100%;
            touch-action: auto;
        }

        .table-scroll-hint {
            display: none;
        }

        .table-container:focus-visible {
            outline: 3px solid #667eea;
            outline-offset: 3px;
        }

        @media (min-width: 768px) {
            .table-container {
                border-radius: 20px;
                margin-bottom: 40px;
            }
        }

        table {
            width: 100%;
            min-width: 650px;
            border-collapse: collapse;
            display: table;
        }

        thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .col-rank {
            width: 55px;
            min-width: 55px;
            text-align: center;
            line-height: 1.2;
        }

        @media (max-width: 767px) {
            th.col-rank,
            td.col-rank {
                position: sticky;
                left: 0;
                z-index: 3;
            }
            
            thead th.col-rank {
                z-index: 12;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            }
            
            tbody td.col-rank {
                background: white;
            }
            
            tbody tr:hover td.col-rank {
                background: #f8f9ff;
            }
            
            td.col-rank::after {
                content: '';
                position: absolute;
                right: 0;
                top: 0;
                bottom: 0;
                width: 3px;
                background: linear-gradient(90deg, rgba(0,0,0,0.06), transparent);
                pointer-events: none;
            }
        }

        .rank-num {
            font-weight: 700;
            font-size: 1em;
            color: #2c3e50;
        }

        .rank-1 .rank-num { color: #e74c3c; }
        .rank-2 .rank-num { color: #e67e22; }
        .rank-3 .rank-num { color: #f1c40f; }

        .rank-code {
            font-size: 0.7em;
            color: #667eea;
            font-family: 'Courier New', monospace;
            margin-top: 2px;
        }

        .col-stock {
            width: 110px;
            min-width: 110px;
            text-align: left;
            padding-left: 8px !important;
        }

        th.col-stock {
            color: white;
        }

        .stock-name {
            font-weight: 600;
            color: #2c3e50;
            font-size: 0.9em;
            line-height: 1.3;
            word-wrap: break-word;
        }

        .stock-code {
            font-size: 0.7em;
            color: #667eea;
            font-family: 'Courier New', monospace;
            margin-top: 2px;
        }

        .mobile-only {
            display: block;
        }
        .desktop-only {
            display: none;
        }

        @media (min-width: 768px) {
            .mobile-only {
                display: none;
            }
            .desktop-only {
                display: block;
            }
        }

        th {
            padding: 14px 6px;
            text-align: center;
            font-weight: 600;
            font-size: 0.8em;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }

        @media (min-width: 768px) {
            th {
                padding: 18px 12px;
                font-size: 0.95em;
            }
        }

        td {
            padding: 10px 4px;
            text-align: center;
            border-bottom: 1px solid #f0f0f0;
            font-size: 0.85em;
            transition: background 0.2s;
        }

        @media (min-width: 768px) {
            td {
                padding: 16px 12px;
                font-size: 0.95em;
            }
        }

        tbody tr:hover {
            background: linear-gradient(90deg, rgba(102, 126, 234, 0.03) 0%, rgba(118, 75, 162, 0.03) 100%);
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        .rank {
            font-weight: 600;
            color: #95a5a6;
            font-size: 0.9em;
        }

        .rank-1 {
            font-weight: 700;
            color: #f39c12;
            font-size: 1.1em;
        }

        .rank-2 {
            font-weight: 700;
            color: #95a5a6;
            font-size: 1.05em;
        }

        .rank-3 {
            font-weight: 700;
            color: #cd7f32;
            font-size: 1em;
        }

        .price-up {
            color: #e74c3c;
            font-weight: 600;
        }

        .price-down {
            color: #27ae60;
            font-weight: 600;
        }

        .price-neutral {
            color: #95a5a6;
        }

        .volume-cell {
            padding: 0 !important;
            position: relative;
        }

        .volume-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 8px 12px;
            position: relative;
            min-height: 45px;
        }

        .volume-text {
            position: relative;
            z-index: 2;
        }

        .vol-bars-container {
            position: absolute;
            top: 4px;
            bottom: 4px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 1px;
        }

        .bid-bars {
            right: 0;
            left: 0;
        }

        .ask-bars {
            left: 0;
            right: 0;
        }

        .vol-bar {
            height: 5px;
            border-radius: 2px;
            min-width: 2px;
        }

        .bid-bar {
            margin-left: auto;
        }

        .ask-bar {
            margin-right: auto;
        }

        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 30px 50px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            z-index: 1000;
            display: none;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            text-align: center;
            color: #667eea;
            font-weight: 600;
            font-size: 1.1em;
        }

        @media (max-width: 767px) {
            table {
                font-size: 0.85em;
            }
            
            th, td {
                padding: 10px 4px;
            }
            
            .stock-name {
                max-width: 95px;
                line-height: 1.2;
                word-wrap: break-word;
            }
        }

        .message-box {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 16px 24px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(102, 126, 234, 0.4);
            z-index: 1000;
            font-weight: 500;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @media (max-width: 767px) {
            .message-box {
                top: 10px;
                right: 10px;
                left: 10px;
                padding: 12px 16px;
                font-size: 0.9em;
            }
        }

        .iframe-container {
            background: white;
            border-radius: 16px;
            position: relative;
            width: 100%;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.08);
        }

        .iframe-container iframe {
            display: block;
            width: 100%;
            height: calc(100vh - 280px);
            min-height: 500px;
            border: none;
            border-radius: 16px;
        }

        .stock-panel {
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.08);
            min-width: 0;
        }

        .stock-list-header, .chart-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        #stockSearch {
            padding: 10px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            width: 300px;
            max-width: 100%;
            min-width: 0;
            font-size: 1em;
        }

        .chart-stock-picker {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 0;
            justify-content: center;
            flex-wrap: wrap;
        }

        #stockSelector {
            padding: 10px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 1em;
            min-width: 0;
            max-width: 100%;
            cursor: pointer;
        }

        .stock-nav-button {
            padding: 10px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.2em;
            font-weight: 500;
            flex-shrink: 0;
        }

        #stockChartContent, #stockAnalysisCard {
            min-width: 0;
            overflow-wrap: anywhere;
        }

        #plotlyChart {
            width: 100%;
            height: 800px;
        }

        @media (max-width: 767px) {
            body {
                padding: 8px;
                padding-bottom: max(16px, env(safe-area-inset-bottom));
                padding-left: max(8px, env(safe-area-inset-left));
                padding-right: max(8px, env(safe-area-inset-right));
            }

            .header {
                padding: 12px;
            }

            .version {
                position: static;
                text-align: right;
                margin-bottom: 4px;
            }

            h1 {
                font-size: 1.25em;
                line-height: 1.4;
            }

            .market-selector {
                flex-wrap: wrap;
            }

            .market-btn, .category-tab {
                min-height: 44px;
            }

            .category-tabs {
                display: grid;
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 6px;
            }

            .category-tab {
                padding: 8px 6px;
                border-radius: 12px;
                font-size: 0.85em;
                line-height: 1.4;
                overflow-wrap: anywhere;
            }

            .controls {
                display: grid;
                grid-template-columns: minmax(0, 1fr) auto;
                padding: 12px;
            }

            .sort-group {
                min-width: 0;
                flex-direction: column;
                align-items: stretch;
                gap: 4px;
            }

            .sort-select {
                width: 100%;
                font-size: 16px;
                min-height: 44px;
            }

            .sort-toggle {
                align-self: end;
                min-height: 44px;
                padding: 10px 12px;
            }

            .table-scroll-hint {
                display: block;
                padding: 10px 12px;
                color: #596a7a;
                font-size: 0.8em;
                background: #f8f9ff;
                border-radius: 12px;
                margin-bottom: 8px;
            }

            .iframe-container {
                border-radius: 12px;
                margin: 0;
                width: 100%;
            }

            .iframe-container iframe {
                border-radius: 12px;
                min-height: 0;
                width: 100%;
            }

            .stock-panel {
                padding: 12px;
            }

            .stock-list-header {
                align-items: stretch;
                flex-direction: column;
            }

            #stockSearch {
                width: 100%;
                min-height: 44px;
                font-size: 16px;
            }

            #stockListContent {
                max-height: none !important;
                overflow: visible !important;
            }

            .chart-toolbar {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .chart-stock-picker {
                grid-column: 1 / -1;
                grid-row: 1;
                justify-content: flex-start;
            }

            #stockSelector {
                width: 100%;
                min-height: 44px;
                font-size: 16px;
            }

            .chart-stock-picker label {
                min-height: 44px;
            }

            .stock-nav-button {
                width: 100%;
                min-height: 44px;
                padding: 10px 12px;
                font-size: 1em;
            }

            #plotlyChart {
                height: 1000px;
            }

            .loading {
                width: min(280px, calc(100% - 32px));
                padding: 24px;
            }
        }

        .stock-item:hover {
            background: #e9ecef !important;
            border-color: #667eea !important;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="version">v2.5</div>
            <h1>台股機構投資人買賣分析</h1>
            <div class="subtitle">即時追蹤三大法人買賣超數據</div>
            
            <div class="market-selector">
                <button class="market-btn active" id="btnTSE" onclick="switchMarket('TSE')">上市</button>
                <button class="market-btn" id="btnOTC" onclick="switchMarket('OTC')">上櫃</button>
                <button class="market-btn" id="btnWATCHLIST" onclick="switchMarket('WATCHLIST')">追蹤股</button>
            </div>
            
            <div class="info-bar" style="display: flex; justify-content: center; align-items: center; margin-bottom: 12px; font-size: 0.9em;">
                <div class="info-item" style="display: flex; align-items: center; gap: 4px;">
                    <span class="info-icon">🕐</span>
                    <span class="info-text" id="updateTime">--:--:--</span>
                </div>
            </div>
            
            <div class="category-tabs" id="stockCategoryTabs">
                <button class="category-tab active" id="tabLatest" onclick="switchCategory('latest')">
                    最新買賣比
                </button>
                <button class="category-tab" id="tabFiveDay" onclick="switchCategory('fiveday')">
                    過去五日買賣超
                </button>
                <button class="category-tab" id="tabSixtyDay" onclick="switchCategory('sixtyDay')">
                    歷史90天買賣
                </button>
            </div>
        </div>

        <div class="controls" id="controls">
            <div class="sort-group">
                <span class="sort-label">排序依據：</span>
                <select class="sort-select" id="sortField">
                    <option value="default">預設排序</option>
                    <option value="change_value">漲跌</option>
                    <option value="change">漲跌幅</option>
                    <option value="buy_volume">買進(張)</option>
                    <option value="sell_volume">賣出(張)</option>
                    <option value="ratio">買賣比</option>
                </select>
            </div>
            <button class="sort-toggle" onclick="toggleSort()">
                <span id="sortIcon">↓</span>
                <span id="sortText">高到低</span>
            </button>
        </div>

        <p class="table-scroll-hint" id="tableScrollHint">↔ 左右滑動表格，查看全部欄位</p>
        <div class="table-container" id="tableContainer" tabindex="0" role="region" aria-label="股票買賣比表格" aria-describedby="tableScrollHint">
            <table id="dataTable">
                <thead>
                    <tr>
                        <th class="col-rank">排名</th>
                        <th class="col-stock">股票</th>
                        <th style="width: 48px;">昨收</th>
                        <th style="width: 95px;">買進(張)</th>
                        <th style="width: 48px;">成交價</th>
                        <th style="width: 95px;">賣出(張)</th>
                        <th style="width: 43px;">漲跌</th>

    <script>
        const DATA_PATH = './StockInfo/';
        
        let currentMarket = localStorage.getItem('currentMarket') || 'TSE';
        let currentCategory = localStorage.getItem('currentCategory') || 'latest';
        let sqlDB = null;
        let reportResizeObserver = null;
        let currentChartTitle = '';

        if (currentMarket === 'CONCEPT') {
            currentMarket = 'TSE';
            localStorage.setItem('currentMarket', 'TSE');
        }
        
        if (currentCategory === 'conceptDesc' || currentCategory === 'conceptQuote') {
            currentCategory = 'latest';
            localStorage.setItem('currentCategory', 'latest');
        }
        
        let currentStocks = [];
        let currentSortField = 'default';
        let currentSortOrder = 'desc';
        let tseData = null;
        let otcData = null;
        
        // 買賣超90天相關的全域變數
        let allStocksList = [];  // 所有股票清單
        let currentStockIndex = 0;  // 當前股票索引
        let isReverseOrder = false;  // 是否反向排序

        function toggleSort() {
            currentSortOrder = currentSortOrder === 'desc' ? 'asc' : 'desc';
            document.getElementById('sortIcon').textContent = currentSortOrder === 'desc' ? '↓' : '↑';
            document.getElementById('sortText').textContent = currentSortOrder === 'desc' ? '高到低' : '低到高';
            applySorting();
        }

        function applySorting() {
            if (!currentStocks || currentStocks.length === 0) return;
            
            let sortedStocks = [...currentStocks];
            
            if (currentSortField === 'default') {
                updateTable(sortedStocks);
                return;
            }

            sortedStocks.sort((a, b) => {
                let aVal, bVal;
                
                switch (currentSortField) {
                    case 'code':
                        aVal = a.code || '';
                        bVal = b.code || '';
                        return currentSortOrder === 'desc' ? 
                            bVal.localeCompare(aVal) : aVal.localeCompare(bVal);
                    
                    case 'name':
                        aVal = a.name || '';
                        bVal = b.name || '';
                        return currentSortOrder === 'desc' ? 
                            bVal.localeCompare(aVal, 'zh-TW') : aVal.localeCompare(bVal, 'zh-TW');
                    
                    case 'price':
                        aVal = parseFloat(a.current_price) || 0;
                        bVal = parseFloat(b.current_price) || 0;
                        break;
                    
                    case 'change_value':
                        aVal = parseFloat(a.change) || 0;
                        bVal = parseFloat(b.change) || 0;
                        break;
                    
                    case 'change':
                        aVal = parseFloat(a.change_percent) || 0;
                        bVal = parseFloat(b.change_percent) || 0;
                        break;
                    
                    case 'buy_volume':
                        aVal = parseInt(a.buy_volume) || 0;
                        bVal = parseInt(b.buy_volume) || 0;
                        break;
                    
                    case 'sell_volume':
                        aVal = parseInt(a.sell_volume) || 0;
                        bVal = parseInt(b.sell_volume) || 0;
                        break;
                    
                    case 'ratio':
                        const buyA = parseInt(a.buy_volume) || 0;
                        const sellA = parseInt(a.sell_volume) || 1;
                        const buyB = parseInt(b.buy_volume) || 0;
                        const sellB = parseInt(b.sell_volume) || 1;
                        aVal = buyA / sellA;
                        bVal = buyB / sellB;
                        break;
                    
                    default:
                        return 0;
                }
                
                return currentSortOrder === 'desc' ? bVal - aVal : aVal - bVal;
            });
            
            updateTable(sortedStocks);
        }

        function showMessage(text, type = 'info') {
            const messageBox = document.createElement('div');
            messageBox.className = 'message-box';
            messageBox.textContent = text;
            document.body.appendChild(messageBox);
            
            setTimeout(() => {
                messageBox.innerHTML = '';
            }, 4000);
        }

        function formatNumber(num) {
            if (num === '無資料' || num === '-' || !num) return '-';
            const n = parseInt(num);
            if (isNaN(n)) return num;
            return n.toLocaleString();
        }

        function getPriceClass(change) {
            if (!change || change === '-' || change === '無資料') return 'price-neutral';
            if (change.includes('+') || parseFloat(change) > 0) return 'price-up';
            if (change.includes('-') || parseFloat(change) < 0) return 'price-down';
            return 'price-neutral';
        }

        function generateVolumeBars(volumes, type) {
            if (!volumes || !Array.isArray(volumes) || volumes.length === 0) {
                return '';
            }
            
            const nums = volumes.map(v => parseInt(v) || 0);
            const maxVol = Math.max(...nums);
            
            if (maxVol === 0) return '';
            
            const bars = nums.map((vol, i) => {
                const percent = (vol / maxVol) * 100;
                const color = type === 'bid' ? 'rgba(231, 76, 60, 0.3)' : 'rgba(39, 174, 96, 0.3)';
                
                if (type === 'bid') {
                    return `<div class="vol-bar bid-bar" style="width: ${percent}%; background: ${color};"></div>`;
                } else {
                    return `<div class="vol-bar ask-bar" style="width: ${percent}%; background: ${color};"></div>`;
                }
            }).join('');
            
            return `<div class="vol-bars-container ${type}-bars">${bars}</div>`;
        }

        function switchMarket(market) {
            currentMarket = market;
            localStorage.setItem('currentMarket', market);
            
            document.getElementById('btnTSE').classList.remove('active');
            document.getElementById('btnOTC').classList.remove('active');

            if (market === 'TSE') {

            } else if (market === 'OTC') {

        function resizeExternalFrame() {
            const iframe = document.getElementById('externalFrame');
            if (!window.matchMedia('(max-width: 767px)').matches) {
                iframe.style.height = '';
                return;
            }
            try {
                const body = iframe.contentDocument?.body;
                if (body) {
                    // 手機跟隨報告內容高度，讓整頁捲動，也會隨報告分頁更新。
                    const height = Math.ceil(Math.max(body.scrollHeight, body.getBoundingClientRect().height));
                    if (height > 0) iframe.style.height = `${height}px`;
                }
            } catch (error) {
                // 跨來源報告使用 iframe 自身的捲動功能。
            }
        }

        function loadExternalPage(filename) {
            const iframe = document.getElementById('externalFrame');
            reportResizeObserver?.disconnect();
            iframe.style.height = '';
            
            iframe.onload = function() {
                try {
                    const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                    const style = iframeDoc.createElement('style');
                    style.id = 'reportResponsiveStyles';
                    // 在入口套用樣式，報告資料重新產生後仍保有手機排版。
                    style.textContent = `
                        .table-container {
                            max-width: 100%;
                            overflow-x: auto;
                            touch-action: auto;
                        }
                        @media (max-width: 767px) {
                            html, body { min-height: 0 !important; }
                            body { padding: 6px; font-size: 14px; }
                            .tabs { padding: 8px 8px 0; }
                            .tab-buttons {
                                display: grid;
                                grid-template-columns: repeat(3, minmax(0, 1fr));
                                gap: 6px;
                            }
                            .tab-button {
                                min-height: 44px;
                                padding: 8px 4px;
                                font-size: 13px;
                                border-radius: 8px;
                            }
                            .section { padding: 10px; margin-bottom: 12px; }
                            .section-title {
                                font-size: 16px;
                                line-height: 1.5;
                                overflow-wrap: anywhere;
                            }
                            .table-container::before {
                                content: '↔ 左右滑動表格，查看全部欄位';
                                display: block;
                                position: sticky;
                                left: 0;
                                padding: 8px 0;
                                font-size: 12px;
                                color: #596a7a;
                            }
                            table { min-width: 560px; font-size: 14px; }
                            th, td { padding: 10px 8px; font-size: 14px; }
                            .stock-code, .price-up, .price-down {
                                width: auto;
                                max-width: none;
                                white-space: nowrap;
                            }
                            .stock-code { min-width: 76px; }
                            .stock-name {
                                max-width: none;
                                white-space: normal;
                                overflow: visible;
                                overflow-wrap: anywhere;
                            }
                            .footer { padding: 12px; font-size: 14px; overflow-wrap: anywhere; }
                        }
                    `;
                    iframeDoc.head.appendChild(style);
                    const viewport = iframeDoc.querySelector('meta[name="viewport"]');
                    if (viewport) viewport.content = 'width=device-width, initial-scale=1.0';
                    // 舊版報告在冒泡階段攔截縮放，保留瀏覽器原生雙指手勢。
                    iframeDoc.addEventListener('touchstart', event => {
                        if (event.touches.length > 1) event.stopImmediatePropagation();
                    }, { capture: true, passive: true });
                    iframeDoc.addEventListener('gesturestart', event => {
                        event.stopImmediatePropagation();
                    }, { capture: true, passive: true });
                    iframeDoc.querySelectorAll('.table-container').forEach(table => {
                        table.tabIndex = 0;
                        table.setAttribute('role', 'region');
                        table.setAttribute('aria-label', '法人買賣超表格，可左右捲動');
                    });
                    reportResizeObserver = new ResizeObserver(resizeExternalFrame);
                    reportResizeObserver.observe(iframeDoc.body);
                    resizeExternalFrame();
                } catch(e) {
                    console.log('Cannot inject CSS into iframe (cross-origin)');
                }
            };
            iframe.src = DATA_PATH + filename;
        }

        async function loadStockList() {
            const chartContent = document.getElementById('stockChartContent');
            chartContent.innerHTML = '<div style="text-align: center; padding: 40px; color: #95a5a6;">載入中...</div>';
            
            try {
                const SQL = await initSqlJs({
                    locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${file}`
                });
                
                const dbPath = currentMarket === 'TSE' ? 
                    DATA_PATH + 'stock_tse.db' : 
                    DATA_PATH + 'stock_otc.db';
                
                const response = await fetch(dbPath);
                const dbBuffer = await response.arrayBuffer();
                sqlDB = new SQL.Database(new Uint8Array(dbBuffer));
                
                // 保持資料庫原有順序
                const query = `
                    SELECT 股票代碼, 股票名稱
                    FROM stock_data
                    WHERE ROWID IN (
                        SELECT MIN(ROWID) 
                        FROM stock_data 
                        GROUP BY 股票代碼
                    )
                    ORDER BY ROWID
                `;
                const result = sqlDB.exec(query);
                
                if (result.length === 0 || result[0].values.length === 0) {
                    chartContent.innerHTML = '<div style="text-align: center; padding: 40px; color: #95a5a6;">無股票資料</div>';
                    return;
                }
                
                // 儲存股票清單
                allStocksList = result[0].values.map(([code, name]) => ({ code, name }));
                
                // 填充下拉選單
                updateStockSelector();
                
                // 載入第一個股票
                currentStockIndex = 0;
                const firstStock = getStockAtIndex(0);
                if (firstStock) {
                    await loadStockChart(firstStock.code, firstStock.name);
                }
                
            } catch (error) {
                console.error('載入股票列表失敗:', error);
                chartContent.innerHTML = `
                    <div style="text-align: center; padding: 40px; color: #e74c3c;">
                        載入失敗: ${error.message}
                    </div>
                `;
            }
        }
        
        // 根據當前排序取得股票
        function getStockAtIndex(index) {
            const list = isReverseOrder ? [...allStocksList].reverse() : allStocksList;
            if (index >= 0 && index < list.length) {
                return list[index];
            }
            return null;
        }
        
        // 更新下拉選單
        function updateStockSelector() {
            const selector = document.getElementById('stockSelector');
            
            // 確保完全清空現有選項
            while (selector.firstChild) {
                selector.removeChild(selector.firstChild);
            }
            
            const list = isReverseOrder ? [...allStocksList].reverse() : allStocksList;
            
            // 使用 DocumentFragment 提高效能並確保不重複
            const fragment = document.createDocumentFragment();
            
            list.forEach((stock, idx) => {
                const option = document.createElement('option');
                option.value = idx;
                option.textContent = `${stock.code}_${stock.name}`;
                fragment.appendChild(option);
            });
            
            selector.appendChild(fragment);
            selector.value = currentStockIndex;
            
            console.log(`✅ 買賣超下拉選單已更新: ${list.length} 個選項`);
        }
        
        // 載入上一筆股票
        function loadPrevStock() {
            if (currentStockIndex > 0) {
                currentStockIndex--;
                const stock = getStockAtIndex(currentStockIndex);
                if (stock) {
                    if (currentMarket === 'WATCHLIST') {
                        loadWatchlistStockChart(stock.code, stock.name, stock.market);
                    } else {
                        loadStockChart(stock.code, stock.name);
                    }
                    document.getElementById('stockSelector').value = currentStockIndex;
                }
            }
        }
        
        // 載入下一筆股票
        function loadNextStock() {
            const maxIndex = allStocksList.length - 1;
            if (currentStockIndex < maxIndex) {
                currentStockIndex++;
                const stock = getStockAtIndex(currentStockIndex);
                if (stock) {
                    if (currentMarket === 'WATCHLIST') {
                        loadWatchlistStockChart(stock.code, stock.name, stock.market);
                    } else {
                        loadStockChart(stock.code, stock.name);
                    }
                    document.getElementById('stockSelector').value = currentStockIndex;
                }
            }
        }
        
        // 從下拉選單載入股票
        function loadStockFromSelector() {
            const selector = document.getElementById('stockSelector');
            const selectedIndex = parseInt(selector.value);
            if (!isNaN(selectedIndex)) {
                currentStockIndex = selectedIndex;
                const stock = getStockAtIndex(selectedIndex);
                if (stock) {
                    if (currentMarket === 'WATCHLIST') {
                        loadWatchlistStockChart(stock.code, stock.name, stock.market);
                    } else {
                        loadStockChart(stock.code, stock.name);
                    }
                }
            }
        }
        
        // 切換反向排序
        function toggleReverseOrder() {
            isReverseOrder = !isReverseOrder;
            
            if (currentMarket === 'WATCHLIST') {
                updateWatchlistSelector();
            } else {
                updateStockSelector();
            }
            
            // 直接跳到第一個股票
            currentStockIndex = 0;
            const firstStock = getStockAtIndex(0);
            if (firstStock) {
                if (currentMarket === 'WATCHLIST') {
                    loadWatchlistStockChart(firstStock.code, firstStock.name, firstStock.market);
                } else {
                    loadStockChart(firstStock.code, firstStock.name);
                }
                document.getElementById('stockSelector').value = 0;
            }
        }

        async function loadStockChart(stockCode, stockName) {
            showStockChartView();
            const chartContent = document.getElementById('stockChartContent');
            chartContent.innerHTML = '<div style="text-align: center; padding: 40px; color: #95a5a6;">生成圖表中...</div>';
            
            try {
                const query = `SELECT * FROM stock_data WHERE 股票代碼 = '${stockCode}' ORDER BY 日期`;
                const result = sqlDB.exec(query);
                
                if (result.length === 0 || result[0].values.length === 0) {
                    chartContent.innerHTML = '<div style="text-align: center; padding: 40px; color: #e74c3c;">無該股票資料</div>';
                    return;
                }
                
                const columns = result[0].columns;
                const rows = result[0].values;
                const data = rows.map(row => {
                    const obj = {};
                    columns.forEach((col, idx) => {
                        obj[col] = row[idx];
                    });
                    return obj;
                });
                
                // 先用全部資料計算MA
                const allCloses = data.map(d => parseFloat(String(d['收盤價']).replace(/,/g, '')) || 0);
                const allMA5 = calculateMA(allCloses, 5);
                const allMA10 = calculateMA(allCloses, 10);
                const allMA20 = calculateMA(allCloses, 20);
                const allMA60 = calculateMA(allCloses, 60);
                
                // 只取最後75筆來顯示
                const chartData = data.slice(-75);
                
                // 保存原始日期字符串用於判斷星期
                const rawDates = chartData.map(d => d['日期']);
                
                // 格式化日期為 MM/DD
                const dates = chartData.map(d => {
                    const date = new Date(d['日期']);
                    const month = String(date.getMonth() + 1).padStart(2, '0');
                    const day = String(date.getDate()).padStart(2, '0');
                    return `${month}/${day}`;
                });
                const opens = chartData.map(d => parseFloat(String(d['開盤價']).replace(/,/g, '')) || 0);
                const highs = chartData.map(d => parseFloat(String(d['最高價']).replace(/,/g, '')) || 0);
                const lows = chartData.map(d => parseFloat(String(d['最低價']).replace(/,/g, '')) || 0);
                const closes = chartData.map(d => parseFloat(String(d['收盤價']).replace(/,/g, '')) || 0);
                const volumes = chartData.map(d => parseFloat(String(d['成交張數']).replace(/,/g, '')) || 0);
                
                // 取最後75筆對應的MA值
                const ma5 = allMA5.slice(-75);
                const ma10 = allMA10.slice(-75);
                const ma20 = allMA20.slice(-75);
                const ma60 = allMA60.slice(-75);
                
                const foreign = chartData.map(d => parseFloat(String(d['外陸資買賣超張數'] || 0).replace(/,/g, '')) || 0);
                const trust = chartData.map(d => parseFloat(String(d['投信買賣超張數'] || 0).replace(/,/g, '')) || 0);
                const dealer = chartData.map(d => parseFloat(String(d['自營商買賣超張數'] || 0).replace(/,/g, '')) || 0);
                
                const foreignCum = cumsum(foreign);
                const trustCum = cumsum(trust);
                const dealerCum = cumsum(dealer);
                
                generatePlotlyChart(chartContent, {
                    stockCode, stockName,
                    dates, rawDates, opens, highs, lows, closes, volumes,
                    ma5, ma10, ma20, ma60,
                    foreign, trust, dealer,
                    foreignCum, trustCum, dealerCum
                });
                
            } catch (error) {
                console.error('生成圖表失敗:', error);
                chartContent.innerHTML = `
                    <div style="text-align: center; padding: 40px; color: #e74c3c;">
                        生成失敗: ${error.message}
                    </div>
                `;
            }
        }

        function calculateMA(data, period) {
            const result = [];
            for (let i = 0; i < data.length; i++) {
                if (i < period - 1) {
                    result.push(null);
                } else {
                    const sum = data.slice(i - period + 1, i + 1).reduce((a, b) => a + b, 0);
                    result.push(sum / period);
                }
            }
            return result;
        }

        function cumsum(arr) {
            let sum = 0;
            return arr.map(val => {
                sum += val;
                return sum;
            });
        }

        function updateWatchlistSelector() {
            const selector = document.getElementById('stockSelector');
            
            // 確保完全清空現有選項
            while (selector.firstChild) {
                selector.removeChild(selector.firstChild);
            }
            
            const list = isReverseOrder ? [...allStocksList].reverse() : allStocksList;
            
            // 使用 DocumentFragment 提高效能並確保不重複
            const fragment = document.createDocumentFragment();
            
            list.forEach((stock, idx) => {
                const option = document.createElement('option');
                option.value = idx;
                option.textContent = `${stock.code}_${stock.name} (${stock.market})`;
                fragment.appendChild(option);
            });
            
            selector.appendChild(fragment);
            selector.value = currentStockIndex;
            
            console.log(`✅ 追蹤股下拉選單已更新: ${list.length} 個選項`);
        }

            chartContent.innerHTML = '<div style="text-align: center; padding: 40px; color: #95a5a6;">生成圖表中...</div>';
            
            // 獲取當前股票的isFocus狀態
            const currentStock = allStocksList.find(s => s.code === stockCode);
            const isFocusStock = currentStock && currentStock.isFocus;
            
            try {
                // 追蹤股票模式：直接從 stock_hot.db 的 hot_stocks 表讀取
                const query = `SELECT * FROM hot_stocks WHERE 股票代碼 = '${stockCode}' ORDER BY 日期`;
                const result = sqlDB.exec(query);
                
                if (result.length === 0 || result[0].values.length === 0) {
                    chartContent.innerHTML = '<div style="text-align: center; padding: 40px; color: #e74c3c;">無該股票資料</div>';
                    return;
                }
                
                const columns = result[0].columns;
                const rows = result[0].values;
                const data = rows.map(row => {
                    const obj = {};
                    columns.forEach((col, idx) => {
                        obj[col] = row[idx];
                    });
                    return obj;
                });
                
                // 先用全部資料計算MA
                const allCloses = data.map(d => parseFloat(String(d['收盤價']).replace(/,/g, '')) || 0);
                const allMA5 = calculateMA(allCloses, 5);
                const allMA10 = calculateMA(allCloses, 10);
                const allMA20 = calculateMA(allCloses, 20);
                const allMA60 = calculateMA(allCloses, 60);
                
                // 只取最後75筆來顯示
                const chartData = data.slice(-75);
                
                // 保存原始日期字符串用於判斷星期

                // 格式化日期為 MM/DD
                const dates = chartData.map(d => {
                    const date = new Date(d['日期']);
                    const month = String(date.getMonth() + 1).padStart(2, '0');
                    const day = String(date.getDate()).padStart(2, '0');
                    return `${month}/${day}`;
                });
                const opens = chartData.map(d => parseFloat(String(d['開盤價']).replace(/,/g, '')) || 0);
                const highs = chartData.map(d => parseFloat(String(d['最高價']).replace(/,/g, '')) || 0);
                const lows = chartData.map(d => parseFloat(String(d['最低價']).replace(/,/g, '')) || 0);
                const closes = chartData.map(d => parseFloat(String(d['收盤價']).replace(/,/g, '')) || 0);
                const volumes = chartData.map(d => parseFloat(String(d['成交量']).replace(/,/g, '')) || 0);
                
                // 取最後75筆對應的MA值
                const ma5 = allMA5.slice(-75);
                const ma10 = allMA10.slice(-75);
                const ma20 = allMA20.slice(-75);
                const ma60 = allMA60.slice(-75);
                
                const foreign = chartData.map(d => parseFloat(String(d['外陸資買賣超張數'] || 0).replace(/,/g, '')) || 0);
                const trust = chartData.map(d => parseFloat(String(d['投信買賣超張數'] || 0).replace(/,/g, '')) || 0);
                const dealer = chartData.map(d => parseFloat(String(d['自營商買賣超張數'] || 0).replace(/,/g, '')) || 0);
                
                const foreignCum = cumsum(foreign);
                const trustCum = cumsum(trust);
                const dealerCum = cumsum(dealer);
                
                generatePlotlyChart(chartContent, {
                    stockCode, stockName,
                    dates, rawDates, opens, highs, lows, closes, volumes,
                    ma5, ma10, ma20, ma60,
                    foreign, trust, dealer,
                    foreignCum, trustCum, dealerCum
                }, isFocusStock);
                
                // 載入當前股票的熱門股分析資料
                await loadCurrentStockAnalysis(stockCode);
                
            } catch (error) {
                console.error('生成圖表失敗:', error);
                chartContent.innerHTML = `
                    <div style="text-align: center; padding: 40px; color: #e74c3c;">
                        生成失敗: ${error.message}
                    </div>
                `;
            }
        }

            if (stocks.length === 0) {
                const row = document.createElement('tr');
                row.innerHTML = '<td colspan="10" style="padding: 40px; color: #95a5a6;">資料載入失敗,請稍後重試</td>';
                tbody.appendChild(row);
                table.style.display = 'table';
                return;
            }

            stocks.forEach((stock, index) => {
                const row = document.createElement('tr');
                const rankClass = index === 0 ? 'rank-1' : 
                                 index === 1 ? 'rank-2' : 
                                 index === 2 ? 'rank-3' : 'rank';

                const changeClass = getPriceClass(stock.change);
                const changePercentClass = getPriceClass(stock.change_percent);

                const buyVol = parseInt(stock.buy_volume) || 0;
                const sellVol = parseInt(stock.sell_volume) || 0;
                let buySellRatio = '-';
                let ratioClass = 'price-neutral';
                
                if (sellVol > 0) {
                    const ratio = buyVol / sellVol;
                    buySellRatio = ratio.toFixed(2);
                    
                    if (ratio > 1) {
                        ratioClass = 'price-up';
                    } else if (ratio < 1) {
                        ratioClass = 'price-down';
                    } else {
                        ratioClass = 'price-neutral';
                    }
                } else if (buyVol > 0) {
                    buySellRatio = '∞';
                    ratioClass = 'price-up';
                }

                const bidBars = generateVolumeBars(stock.bid_volumes, 'bid');
                const askBars = generateVolumeBars(stock.ask_volumes, 'ask');

                row.innerHTML = `
                    <td class="col-rank ${rankClass}">
                        <div class="rank-num">${index + 1}</div>
                        <div class="rank-code mobile-only">${stock.code}</div>
                    </td>
                    <td class="col-stock">
                        <div class="stock-name">${stock.name}</div>
                        <div class="stock-code desktop-only">${stock.code}</div>
                    </td>
                    <td style="font-weight: 600; color: #2c3e50;">${stock.close_price}</td>
                    <td class="volume-cell">
                        <div class="volume-wrapper">
                            ${bidBars}
                            <span class="volume-text" style="color: #2c3e50; font-weight: 500;">${formatNumber(stock.buy_volume)}</span>
                        </div>
                    </td>
                    <td style="font-weight: 600; color: #2c3e50;">${stock.current_price}</td>
                    <td class="volume-cell">
                        <div class="volume-wrapper">
                            ${askBars}
                            <span class="volume-text" style="color: #2c3e50; font-weight: 500;">${formatNumber(stock.sell_volume)}</span>
                        </div>
                    </td>
                    <td class="${changeClass}">${stock.change}</td>
                    <td class="${changePercentClass}">${stock.change_percent}</td>
                    <td class="${ratioClass}" style="font-weight: 600;">${buySellRatio}</td>
                `;

                tbody.appendChild(row);
            });

            table.style.display = 'table';
        }

        async function autoLoadData() {
            const loading = document.getElementById('loading');
            loading.style.display = 'block';
            
            try {
                // 如果是追蹤股票模式,直接返回
                if (currentMarket === 'WATCHLIST') {
                    loading.style.display = 'none';
                    return;
                }
                
                const tseResponse = await fetch(DATA_PATH + 'TSE_hotstock_data.json?t=' + Date.now());
                if (tseResponse.ok) {
                    tseData = await tseResponse.json();
                    console.log('✅ TSE 資料已載入');
                }
                
                const otcResponse = await fetch(DATA_PATH + 'OTC_hotstock_data.json?t=' + Date.now());
                if (otcResponse.ok) {
                    otcData = await otcResponse.json();
                    console.log('✅ OTC 資料已載入');
                }
                
                const currentData = currentMarket === 'TSE' ? tseData : otcData;
                
                if (!currentData) {
                    if (currentMarket === 'TSE' && otcData) {
                        switchMarket('OTC');
                    } else if (currentMarket === 'OTC' && tseData) {
                        switchMarket('TSE');
                    } else {
                        throw new Error('無法載入市場資料');
                    }
                } else {
                    document.getElementById('btnTSE').classList.remove('active');
                    document.getElementById('btnOTC').classList.remove('active');
                    document.getElementById('btnWATCHLIST').classList.remove('active');
                    
                    if (currentMarket === 'TSE') {
                        document.getElementById('btnTSE').classList.add('active');
                        document.getElementById('stockCategoryTabs').style.display = '';
                    } else if (currentMarket === 'OTC') {
                        document.getElementById('btnOTC').classList.add('active');
                        document.getElementById('stockCategoryTabs').style.display = '';
                    }
                    
                    document.getElementById('tabLatest').classList.remove('active');
                    document.getElementById('tabFiveDay').classList.remove('active');
                    document.getElementById('tabSixtyDay').classList.remove('active');
                    
                    if (currentCategory === 'latest') {
                        document.getElementById('tabLatest').classList.add('active');
                        showTableView();
                        updateDisplay(currentData);
                    } else if (currentCategory === 'fiveday') {
                        document.getElementById('tabFiveDay').classList.add('active');
                        showIframeView();
                        loadExternalPage(currentMarket === 'TSE' ? 'tse_analysis_result_complete.html' : 'otc_analysis_result_complete.html');
                    } else if (currentCategory === 'sixtyDay') {
                        document.getElementById('tabSixtyDay').classList.add('active');
                        showStockChartView();
                        loadStockList();
                    }
                    
                    document.getElementById('dataTable').style.display = 'table';
                }
                
            } catch (error) {
                console.error('載入失敗:', error);
                
                const tbody = document.getElementById('tableBody');
                tbody.innerHTML = `<tr><td colspan="10" style="padding: 40px; color: #95a5a6;">
                    資料載入失敗,請稍後重試
                </td></tr>`;
                document.getElementById('dataTable').style.display = 'table';
            } finally {
                loading.style.display = 'none';
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            console.log('📱 台股機構投資人買賣分析系統');
            document.getElementById('dataTable').style.display = 'table';
            
            const sortField = document.getElementById('sortField');
            if (sortField) {
                sortField.addEventListener('change', (e) => {
                    currentSortField = e.target.value;
                    applySorting();
                });
            }
            
            // 買賣超90天導航按鈕
            const prevStockBtn = document.getElementById('prevStockBtn');
            if (prevStockBtn) {
                prevStockBtn.addEventListener('click', loadPrevStock);
            }
            
            const nextStockBtn = document.getElementById('nextStockBtn');
            if (nextStockBtn) {
                nextStockBtn.addEventListener('click', loadNextStock);
            }
            
            const stockSelector = document.getElementById('stockSelector');
            if (stockSelector) {
                stockSelector.addEventListener('change', loadStockFromSelector);
            }
            
            const reverseOrderCheckbox = document.getElementById('reverseOrderCheckbox');
            if (reverseOrderCheckbox) {
                reverseOrderCheckbox.addEventListener('change', toggleReverseOrder);
            }
            
            let resizeFrame = null;
            window.addEventListener('resize', () => {
                cancelAnimationFrame(resizeFrame);
                resizeFrame = requestAnimationFrame(() => {
                    resizeExternalFrame();
                    const chart = document.getElementById('plotlyChart');
                    if (chart?.data && document.getElementById('stockChartContainer').style.display !== 'none') {
                        Plotly.relayout(chart, getChartViewportLayout(currentChartTitle));
                    }
                });
            });
            
            autoLoadData();
        });
    </script>
</body>
</html>
